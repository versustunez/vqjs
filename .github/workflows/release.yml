name: Release
run-name: "Release"
on:
  push:
    tags:
      - '**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_DIR: Builds
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-latest ]
        buildType: [ Release ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: rustup update nightly && rustup default nightly
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ matrix.buildType }} .
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=${{ matrix.buildType }}
      - name: Build
        shell: bash
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ matrix.buildType }} --parallel 4
      - name: Package
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -eq "Windows") {
            7z a vqjs-${{runner.os}}.zip includes/ bin/*.dll bin/*.lib
          }
          else {
            zip -r vqjs-${{runner.os}}.zip includes/ bin/*.so
          }
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: vqjs-${{runner.os}}.zip
          path: vqjs-${{runner.os}}.zip
  release:
    if: contains(github.ref, 'tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          files: |
            **/*.zip
